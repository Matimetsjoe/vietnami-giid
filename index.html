<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Vietnami Giid</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #camera-container {
      position: relative;
      flex: 1;
      overflow: hidden;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #controls {
      position: absolute;
      bottom: 24px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 12px;
      z-index: 10;
    }
    .action-btn {
      background: #e63946;
      color: white;
      border: none;
      padding: 16px 28px;
      border-radius: 50px;
      font-size: 17px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      cursor: pointer;
    }
    .stop-btn {
      background: #333;
      color: white;
      border: none;
      padding: 16px 22px;
      border-radius: 50px;
      font-size: 17px;
      cursor: pointer;
    }
    .action-btn:disabled {
      background: #666;
    }
    #output-box {
      max-height: 42vh;
      background: rgba(18, 18, 18, 0.95);
      padding: 18px;
      overflow-y: auto;
      border-top: 1px solid #333;
    }
    #setup-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px;
      z-index: 100;
    }
    input {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #222;
      color: #fff;
      margin-bottom: 16px;
      font-size: 16px;
    }
    button.save-btn {
      padding: 12px;
      border-radius: 8px;
      background: #2a9d8f;
      color: white;
      border: none;
      font-weight: bold;
      font-size: 16px;
    }
    .status-text {
      font-style: italic;
      color: #aaa;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <div id="setup-modal">
    <h2 style="margin-bottom: 12px;">Tere tulemast!</h2>
    <p style="margin-bottom: 16px; color: #ccc;">Sisesta oma Gemini API võti:</p>
    <input type="password" id="api-key-input" placeholder="AIzaSy..." />
    <button class="save-btn" onclick="saveApiKey()">Alusta giidiga</button>
  </div>

  <div id="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" style="display:none;"></canvas>
    
    <div id="controls">
      <button id="scan-btn" class="action-btn" onclick="captureAndExplain()">Räägi sellest</button>
      <button class="stop-btn" onclick="stopSpeaking()">Vaikus</button>
    </div>
  </div>

  <div id="output-box">
    <div id="status" class="status-text">Valmis pildistama...</div>
    <div id="result">Suuna kaamera huvipakkuvale kohale ja vajuta nupule.</div>
  </div>

  <script>
    let apiKey = localStorage.getItem('gemini_api_key') || '';
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    const scanBtn = document.getElementById('scan-btn');
    let userLocation = null;

    if (apiKey) {
      document.getElementById('setup-modal').style.display = 'none';
      startCamera();
    }

    function saveApiKey() {
      const val = document.getElementById('api-key-input').value.trim();
      if (!val) return alert('Palun sisesta API võti!');
      apiKey = val;
      localStorage.setItem('gemini_api_key', apiKey);
      document.getElementById('setup-modal').style.display = 'none';
      startCamera();
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { 
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 }
          },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        alert('Kaamerat ei õnnestunud avada: ' + err.message);
      }

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => { userLocation = { lat: pos.coords.latitude, lon: pos.coords.longitude }; },
          err => console.log('GPS info puudub:', err)
        );
      }
    }

    function stopSpeaking() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    function speakEstonian(text) {
      if (!('speechSynthesis' in window)) return;
      stopSpeaking();
      
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'et-EE';
      utterance.rate = 1.0;
      
      const voices = window.speechSynthesis.getVoices();
      const etVoice = voices.find(v => v.lang.startsWith('et'));
      if (etVoice) utterance.voice = etVoice;

      window.speechSynthesis.speak(utterance);
    }

    function getOptimizedImageData() {
      const vw = video.videoWidth || 640;
      const vh = video.videoHeight || 480;
      const maxDim = 800;
      
      let targetW = vw;
      let targetH = vh;
      if (vw > maxDim || vh > maxDim) {
        if (vw > vh) {
          targetW = maxDim;
          targetH = Math.round((vh * maxDim) / vw);
        } else {
          targetH = maxDim;
          targetW = Math.round((vw * maxDim) / vh);
        }
      }

      canvas.width = targetW;
      canvas.height = targetH;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, targetW, targetH);
      return canvas.toDataURL('image/jpeg', 0.65).split(',')[1];
    }

    async function queryModel(modelName, prompt, base64Data) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: prompt },
              { inline_data: { mime_type: "image/jpeg", data: base64Data } }
            ]
          }]
        })
      });

      const data = await response.json();
      if (data.error) throw new Error(`${modelName}: ${data.error.message}`);
      return data.candidates[0].content.parts[0].text;
    }

    async function captureAndExplain() {
      scanBtn.disabled = true;
      stopSpeaking();
      statusEl.innerText = "Kiiranalüüs käib...";
      resultEl.innerText = "";

      const base64Data = getOptimizedImageData();
      const locInfo = userLocation ? `Koordinaadid: ${userLocation.lat.toFixed(4)}, ${userLocation.lon.toFixed(4)}.` : '';
      
      const prompt = `Sa oled soe, elav ja haritud eestikeelne reisigiid Vietnamis. ${locInfo}
Tuvasta pildil olev koht, hoone, söök või objekt. 
Räägi reisijale sõbralikult ja ladusalt 3 kuni 5 sisukat lauset:
1. Mis see täpselt on ja mis on selle kohalik nimi või tähendus.
2. Üks põnev fakt, kultuuriline taust või kohalik tava, mis sellega seondub.
Ära tee ametlikku sissejuhatust, räägi nagu hea giid teekaaslasele. Ära kasuta loetelusid ega tärne.`;

      // Kasutame kehtivaid mudeleid
      const candidateModels = ['gemini-3.8-flash', 'gemini-3.8-pro'];
      let lastErrors = [];

      for (const model of candidateModels) {
        // Teeme vajadusel 2 katset puhuks, kui server teatab ajutisest koormusest
        for (let attempt = 1; attempt <= 2; attempt++) {
          try {
            statusEl.innerText = `Giid analüüsib (${model})...`;
            const reply = await queryModel(model, prompt, base64Data);
            
            statusEl.innerText = "Giid räägib:";
            resultEl.innerText = reply;
            speakEstonian(reply);
            scanBtn.disabled = false;
            return;
          } catch (err) {
            console.warn(`Katse ${attempt} mudeliga ${model} ebaõnnestus:`, err.message);
            lastErrors.push(err.message);
            // Kui server oli ülekoormatud, ootame pool sekundit enne uut katset
            await new Promise(r => setTimeout(r, 600));
          }
        }
      }

      statusEl.innerText = "Tõrge ühendusel:";
      resultEl.innerText = lastErrors.join("\n\n");
      scanBtn.disabled = false;
    }
  </script>
</body>
</html>
