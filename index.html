<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Vietnami Giid</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212; color: #fff; overflow: hidden;
      display: flex; flex-direction: column; height: 100dvh;
    }
    #camera-container { position: relative; flex: 1 1 45%; min-height: 0; overflow: hidden; background: #000; }
    video, #frozen { width: 100%; height: 100%; object-fit: cover; }
    #frozen { position: absolute; inset: 0; display: none; }
    .top-btns {
      position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 10;
      display: flex; gap: 8px;
    }
    .top-btns button {
      background: rgba(0,0,0,0.55); color: #fff; border: 1px solid #555; border-radius: 50px;
      padding: 8px 14px; font-size: 15px;
    }
    #badge {
      position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; z-index: 10;
      background: rgba(0,0,0,0.55); border-radius: 50px; padding: 8px 12px; font-size: 13px; display: none;
    }
    #saved-toast {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 10;
      background: #2a9d8f; color: #fff; border-radius: 50px; padding: 8px 16px; font-size: 14px; font-weight: 600;
    }
    #controls {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
      padding: 10px 12px; background: #1b1b1b; border-top: 1px solid #333;
    }
    #controls button {
      border: none; border-radius: 12px; padding: 14px 6px; font-size: 15px; font-weight: 600;
      color: #fff; background: #333; cursor: pointer;
    }
    #controls button:disabled { opacity: 0.4; }
    #scan-btn { grid-column: 1 / -1; background: #e63946; font-size: 18px; padding: 16px; }
    #scan-btn:disabled { background: #666; opacity: 1; }
    #output-box {
      flex: 1 1 55%; min-height: 0; overflow-y: auto; padding: 14px 16px calc(16px + env(safe-area-inset-bottom, 0px));
      background: #121212; line-height: 1.55;
    }
    #steps { list-style: none; margin-bottom: 12px; font-size: 14px; color: #aaa; display: grid; gap: 4px; }
    #steps li.done { color: #7bd389; }
    #steps li.active { color: #fff; }
    #steps li.err { color: #ff6b6b; }
    #result { font-size: 18px; white-space: pre-wrap; }
    #result .speaking { background: rgba(230,57,70,0.25); border-radius: 4px; }

    /* Päevik */
    #journal {
      position: fixed; inset: 0; z-index: 50; background: #121212;
      display: flex; flex-direction: column;
      padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .j-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #333; }
    .j-head h2 { font-size: 20px; }
    .j-head button { background: #333; color: #fff; border: none; border-radius: 50px; padding: 8px 14px; font-size: 16px; }
    .j-actions { display: flex; gap: 8px; padding: 12px 16px; flex-wrap: wrap; border-bottom: 1px solid #333; }
    .j-actions button { flex: 1 1 auto; background: #2a9d8f; color: #fff; border: none; border-radius: 10px; padding: 12px 10px; font-size: 15px; font-weight: 600; }
    .j-actions button.danger { background: #444; }
    .j-actions button.confirm { background: #e63946; }
    #j-list { flex: 1; overflow-y: auto; padding: 12px 16px 24px; display: grid; gap: 16px; align-content: start; }
    .j-item { background: #1b1b1b; border: 1px solid #2c2c2c; border-radius: 14px; overflow: hidden; }
    .j-item img { display: block; width: 100%; max-height: 240px; object-fit: cover; }
    .j-body { padding: 12px 14px; display: grid; gap: 8px; }
    .j-meta { font-size: 13px; color: #aaa; display: flex; gap: 12px; flex-wrap: wrap; }
    .j-meta a { color: #7bd389; }
    .j-text { font-size: 16px; line-height: 1.5; white-space: pre-wrap; }
    .j-body textarea {
      width: 100%; min-height: 60px; background: #222; color: #fff; border: 1px solid #444; border-radius: 8px;
      padding: 8px 10px; font: inherit; font-size: 15px; resize: vertical;
    }
    .j-btns { display: flex; gap: 8px; }
    .j-btns button { background: #333; color: #fff; border: none; border-radius: 8px; padding: 8px 12px; font-size: 14px; }
    .j-btns button.confirm { background: #e63946; }
    .j-empty { color: #aaa; text-align: center; padding: 40px 0; }

    #setup-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: flex; flex-direction: column;
      justify-content: center; padding: 24px; z-index: 100;
    }
    #setup-modal input { padding: 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; margin-bottom: 16px; font-size: 16px; }
    #setup-modal button { padding: 12px; border-radius: 8px; background: #2a9d8f; color: white; border: none; font-weight: bold; font-size: 16px; }
  </style>
  <script>
    window.onerror = function (msg, src, line) {
      var box = document.getElementById('steps');
      var t = '✗ Skriptiviga: ' + msg + ' (rida ' + line + ')';
      if (box) box.innerHTML += '<li class="err">' + t.replace(/</g, '&lt;') + '</li>';
      else document.addEventListener('DOMContentLoaded', function(){ window.onerror(msg, src, line); });
    };
  </script>
</head>
<body>

  <div id="setup-modal">
    <h2 style="margin-bottom: 12px;">Tere tulemast!</h2>
    <p style="margin-bottom: 16px; color: #ccc;">Sisesta oma Gemini API võti:</p>
    <input type="password" id="api-key-input" placeholder="AIzaSy..." />
    <button onclick="saveApiKey()">Alusta giidiga</button>
  </div>

  <div id="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <img id="frozen" alt="">
    <canvas id="canvas" style="display:none;"></canvas>
    <div id="badge"></div>
    <div class="top-btns">
      <button onclick="openJournal()">📔 Päevik</button>
      <button onclick="location.reload()">⟳ v5</button>
    </div>
    <div id="saved-toast" hidden>✓ Salvestatud päevikusse</div>
  </div>

  <div id="controls">
    <button id="scan-btn" onclick="captureAndExplain()">📷 Räägi sellest</button>
    <button id="retry-btn" onclick="retryLast()" disabled>↻ Küsi uuesti</button>
    <button id="replay-btn" onclick="replay()" disabled>▶ Kuula uuesti</button>
    <button id="stop-btn" onclick="stopAll()">■ Vaikus</button>
  </div>

  <div id="output-box">
    <ul id="steps"><li>Suuna kaamera huvipakkuvale kohale ja vajuta „Räägi sellest“.</li></ul>
    <div id="result"></div>
  </div>

  <div id="journal" hidden>
    <div class="j-head">
      <h2 id="j-title">Reisipäevik</h2>
      <button onclick="closeJournal()">✕ Sulge</button>
    </div>
    <div class="j-actions">
      <button onclick="exportHtml()">⬇ Päevik (HTML)</button>
      <button onclick="exportTxt()">⬇ Tekstid (TXT)</button>
      <button id="clear-btn" class="danger" onclick="clearAll(this)">🗑 Kustuta kõik</button>
    </div>
    <div id="j-list"></div>
  </div>

  <script>
    const MODELS = ['gemini-3.8-flash', 'gemini-3.5-flash-lite'];

    let apiKey = localStorage.getItem('gemini_api_key') || '';
    const $ = id => document.getElementById(id);
    const video = $('video'), canvas = $('canvas'), frozen = $('frozen'), badge = $('badge');
    const stepsEl = $('steps'), resultEl = $('result'), outBox = $('output-box');
    const scanBtn = $('scan-btn'), retryBtn = $('retry-btn'), replayBtn = $('replay-btn');

    let userLocation = null, currentCtl = null, timer = null;
    let lastMeta = {};
    let lastImage = null, lastPhoto = null, lastEntryId = null, lastText = '', sentences = [];

    if (apiKey) { $('setup-modal').style.display = 'none'; startCamera(); }

    function saveApiKey() {
      const val = $('api-key-input').value.trim();
      if (!val) return;
      apiKey = val;
      localStorage.setItem('gemini_api_key', apiKey);
      $('setup-modal').style.display = 'none';
      startCamera();
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 } }, audio: false
        });
        video.srcObject = stream;
      } catch (err) { setSteps([['Kaamerat ei õnnestunud avada: ' + err.message, 'err']]); }

      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
          pos => { userLocation = { lat: pos.coords.latitude, lon: pos.coords.longitude }; },
          () => {}, { enableHighAccuracy: false, maximumAge: 60000 }
        );
      }
      // Palu brauseril päevikut mitte kustutada, kui mälu jääb vähe
      try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
    }

    // ---------- Andmebaas (IndexedDB – mahutab sadu pilte) ----------
    const DB = (() => {
      let dbp = null;
      function open() {
        if (!dbp) dbp = new Promise((res, rej) => {
          const r = indexedDB.open('giid-paevik', 1);
          r.onupgradeneeded = () => r.result.createObjectStore('finds', { keyPath: 'id' });
          r.onsuccess = () => res(r.result);
          r.onerror = () => rej(r.error);
        });
        return dbp;
      }
      async function tx(mode, fn) {
        const db = await open();
        return new Promise((res, rej) => {
          const t = db.transaction('finds', mode);
          const req = fn(t.objectStore('finds'));
          t.oncomplete = () => res(req ? req.result : undefined);
          t.onerror = () => rej(t.error);
        });
      }
      return {
        put: e => tx('readwrite', s => s.put(e)),
        get: id => tx('readonly', s => s.get(id)),
        all: () => tx('readonly', s => s.getAll()),
        del: id => tx('readwrite', s => s.delete(id)),
        clear: () => tx('readwrite', s => s.clear())
      };
    })();

    // ---------- Olekuread ----------
    let steps = [];
    function setSteps(list) { steps = list; renderSteps(); }
    function step(text, cls = 'active') {
      steps.forEach(s => { if (s[1] === 'active') s[1] = 'done'; });
      steps.push([text, cls]); renderSteps();
    }
    function renderSteps() {
      stepsEl.innerHTML = '';
      for (const [t, c] of steps) {
        const li = document.createElement('li');
        li.className = c;
        li.textContent = (c === 'done' ? '✓ ' : c === 'err' ? '✗ ' : '… ') + t;
        stepsEl.append(li);
      }
    }
    function startTimer() {
      const t0 = performance.now();
      badge.style.display = 'block';
      clearInterval(timer);
      timer = setInterval(() => { badge.textContent = '⏱ ' + ((performance.now() - t0) / 1000).toFixed(1) + ' s'; }, 100);
      return t0;
    }
    function stopTimer() { clearInterval(timer); setTimeout(() => badge.style.display = 'none', 3000); }

    // ---------- Kõne ----------
    let etVoice = null;
    function pickVoice() {
      etVoice = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('et')) || null;
    }
    if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

    function speakSentence(text, index) {
      if (!('speechSynthesis' in window) || !text.trim()) return;
      const u = new SpeechSynthesisUtterance(text.trim());
      u.lang = 'et-EE'; u.rate = 1.05;
      if (etVoice) u.voice = etVoice;
      if (index != null) { u.onstart = () => highlight(index); u.onend = () => highlight(-1); }
      speechSynthesis.speak(u);
    }
    function highlight(i) {
      resultEl.querySelectorAll('span').forEach((s, k) => s.classList.toggle('speaking', k === i));
    }
    function renderResult() {
      resultEl.innerHTML = '';
      sentences.forEach(s => { const sp = document.createElement('span'); sp.textContent = s; resultEl.append(sp); });
    }
    function replay() {
      if (!sentences.length) return;
      speechSynthesis.cancel();
      sentences.forEach((s, i) => speakSentence(s, i));
    }
    function stopAll() {
      if (currentCtl) currentCtl.abort();
      if ('speechSynthesis' in window) speechSynthesis.cancel();
      highlight(-1);
    }

    // ---------- Pilt ----------
    function grab(maxDim, quality) {
      const vw = video.videoWidth || 640, vh = video.videoHeight || 480;
      const s = Math.min(1, maxDim / Math.max(vw, vh));
      canvas.width = Math.round(vw * s); canvas.height = Math.round(vh * s);
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL('image/jpeg', quality);
    }

    // ---------- Gemini voogedastus ----------
    async function streamModel(model, prompt, base64Data, signal, onChunk, onConnected, withThinking) {
      const abortErr = () => { const e = new Error('Peatatud'); e.name = 'AbortError'; return e; };
      const generationConfig = { maxOutputTokens: 2048 };
      if (withThinking) generationConfig.thinkingConfig = { thinkingLevel: 'minimal' };

      const res = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: 'image/jpeg', data: base64Data } }] }],
          generationConfig
        })
      });
      if (signal.aborted) throw abortErr();
      if (!res.ok) {
        let msg = `HTTP ${res.status}`;
        try { msg = (await res.json()).error?.message || msg; } catch (e) {}
        const err = new Error(`${model}: ${msg}`); err.status = res.status; throw err;
      }
      onConnected();

      const handleLine = line => {
        if (!line.startsWith('data:')) return;
        try {
          const j = JSON.parse(line.slice(5));
          const c = j.candidates?.[0];
          if (c?.finishReason) lastMeta.finish = c.finishReason;
          if (j.usageMetadata) lastMeta.usage = j.usageMetadata;
          for (const p of (c?.content?.parts || [])) if (p.text && !p.thought) onChunk(p.text);
        } catch (e) {}
      };

      if (!res.body || !res.body.getReader) {
        const text = await res.text();
        if (signal.aborted) throw abortErr();
        text.split('\n').forEach(handleLine);
        return;
      }
      const reader = res.body.getReader();
      signal.addEventListener('abort', () => { try { reader.cancel(); } catch (e) {} }, { once: true });
      const dec = new TextDecoder();
      let buf = '';
      while (true) {
        const { value, done } = await reader.read();
        if (signal.aborted) throw abortErr();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();
        lines.forEach(handleLine);
      }
      if (buf) handleLine(buf);
    }

    // ---------- Põhitegevus ----------
    function captureAndExplain() {
      lastPhoto = grab(1600, 0.82);      // päeviku jaoks parem kvaliteet
      lastImage = grab(800, 0.65);       // Geminile väike ja kiire
      lastEntryId = null;                // uus leid
      run(lastImage, true);
    }
    function retryLast() { if (lastImage) run(lastImage, false); }

    async function run(dataUrl, fresh) {
      stopAll();
      lastMeta = {};
      if ('speechSynthesis' in window) speechSynthesis.speak(new SpeechSynthesisUtterance(''));

      scanBtn.disabled = true; retryBtn.disabled = true; replayBtn.disabled = true;
      const ctl = new AbortController(); currentCtl = ctl;
      frozen.src = dataUrl; frozen.style.display = 'block';
      sentences = []; lastText = ''; resultEl.innerHTML = '';
      const t0 = startTimer();
      const secs = () => ((performance.now() - t0) / 1000).toFixed(1) + ' s';
      const locAtShot = userLocation ? { ...userLocation } : null;

      const base64Data = dataUrl.split(',')[1];
      const kb = Math.round(base64Data.length * 0.75 / 1024);
      setSteps([[`${fresh ? 'Kaader tehtud' : 'Sama kaader uuesti'} (${kb} KB)`, 'done']]);
      step(locAtShot ? 'GPS asukoht olemas' : 'GPS asukohta pole (toimib ka ilma)', 'done');

      const locInfo = locAtShot ? `Reisija GPS-koordinaadid: ${locAtShot.lat.toFixed(4)}, ${locAtShot.lon.toFixed(4)} (kasuta asukoha täpsustamiseks).` : '';
      const prompt = `Sa oled soe, elav ja haritud eestikeelne reisigiid Vietnamis. ${locInfo}
Tuvasta pildil olev koht, hoone, söök või objekt.
Räägi reisijale sõbralikult ja ladusalt 3 kuni 5 sisukat lauset:
1. Mis see täpselt on ja mis on selle kohalik nimi või tähendus.
2. Üks põnev fakt, kultuuriline taust või kohalik tava, mis sellega seondub.
Kui sa pole kindel, ütle seda ausalt ega leiuta fakte.
Ära tee ametlikku sissejuhatust, räägi nagu hea giid teekaaslasele. Ära kasuta loetelusid ega tärne.`;

      let pending = '', gotText = false, usedModel = '';
      const onChunk = txt => {
        if (!gotText) { gotText = true; step(`Giid räägib (esimesed sõnad ${secs()} pärast)`); }
        lastText += txt; pending += txt;
        const m = pending.match(/^[\s\S]*[.!?…](\s|$)/);
        if (m) {
          const parts = m[0].match(/[^.!?…]+[.!?…]+\s*/g) || [m[0]];
          parts.forEach(p => { sentences.push(p); speakSentence(p, sentences.length - 1); });
          pending = pending.slice(m[0].length);
        }
        renderResult();
        if (pending) resultEl.append(document.createTextNode(pending));
        outBox.scrollTop = outBox.scrollHeight;
      };

      for (const model of MODELS) {
        let withThinking = true;
        for (let attempt = 1; attempt <= 2; attempt++) {
          try {
            usedModel = model;
            step(`Saadan pildi Geminile (${model})…`);
            await streamModel(model, prompt, base64Data, ctl.signal, onChunk,
              () => step(`Pilt kohale jõudnud (${secs()}), giid vaatab pilti…`), withThinking);
            if (pending.trim()) { sentences.push(pending); speakSentence(pending, sentences.length - 1); renderResult(); }
            const u = lastMeta.usage || {};
            step(`Valmis (${secs()}) · lõpu põhjus: ${lastMeta.finish || '?'} · mõtlemine ${u.thoughtsTokenCount || 0} / vastus ${u.candidatesTokenCount || 0} tokenit`, 'done');
            await saveFind(locAtShot, usedModel);
            return finish(true);
          } catch (err) {
            if (err.name === 'AbortError') { step('Peatatud', 'err'); return finish(!!sentences.length); }
            if (lastText) { step('Ühendus katkes poole vastuse pealt', 'err'); await saveFind(locAtShot, usedModel); return finish(true); }
            step(err.message, 'err');
            if (err.status === 400 && /thinking/i.test(err.message) && withThinking) { withThinking = false; continue; }
            if (err.status === 429 || err.status >= 500 || !err.status) { await new Promise(r => setTimeout(r, 500)); continue; }
            break;
          }
        }
      }
      step('Vastust ei saadud. Vajuta „Küsi uuesti“ või kontrolli internetti.', 'err');
      finish(false);

      function finish(hasText) {
        stopTimer();
        scanBtn.disabled = false;
        retryBtn.disabled = !lastImage;
        replayBtn.disabled = !hasText || !sentences.length;
        if (currentCtl === ctl) currentCtl = null;
        setTimeout(() => { frozen.style.display = 'none'; }, 1500);
      }
    }

    // ---------- Päevikusse salvestamine ----------
    async function saveFind(loc, model) {
      const text = lastText.trim();
      if (!text || !lastPhoto) return;
      try {
        let entry;
        if (lastEntryId) {                       // "Küsi uuesti" -> uuenda sama leidu
          entry = await DB.get(lastEntryId);
          if (entry) { entry.text = text; entry.model = model; }
        }
        if (!entry) {
          entry = { id: Date.now(), time: new Date().toISOString(), lat: loc?.lat ?? null, lon: loc?.lon ?? null,
                    photo: lastPhoto, text, model, note: '' };
          lastEntryId = entry.id;
        }
        await DB.put(entry);
        const t = $('saved-toast'); t.hidden = false; setTimeout(() => t.hidden = true, 2000);
      } catch (e) {
        step('Päevikusse salvestamine ebaõnnestus: ' + (e.message || e), 'err');
      }
    }

    // ---------- Päeviku vaade ----------
    const fmtTime = iso => new Date(iso).toLocaleString('et-EE', { day: 'numeric', month: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    const mapUrl = e => `https://www.google.com/maps?q=${e.lat},${e.lon}`;
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    async function openJournal() {
      stopAll();
      $('journal').hidden = false;
      await renderJournal();
    }
    function closeJournal() { $('journal').hidden = true; speechSynthesis.cancel(); }

    async function renderJournal() {
      const list = $('j-list');
      let items = [];
      try { items = (await DB.all()).sort((a, b) => b.id - a.id); } catch (e) {}
      $('j-title').textContent = `Reisipäevik (${items.length})`;
      list.innerHTML = '';
      if (!items.length) { list.innerHTML = '<p class="j-empty">Päevik on veel tühi. Iga „Räägi sellest“ salvestub siia automaatselt.</p>'; return; }

      for (const e of items) {
        const card = document.createElement('div');
        card.className = 'j-item';
        card.innerHTML = `
          <img src="${e.photo}" alt="">
          <div class="j-body">
            <div class="j-meta">
              <span>${esc(fmtTime(e.time))}</span>
              ${e.lat != null ? `<a href="${mapUrl(e)}" target="_blank" rel="noopener">📍 Kaardil</a>` : '<span>📍 asukoht puudub</span>'}
            </div>
            <div class="j-text">${esc(e.text)}</div>
            <textarea id="note-${e.id}" placeholder="Minu märkus (nt mida filmisin, mõte vlogi jaoks)">${esc(e.note || '')}</textarea>
            <div class="j-btns">
              <button data-act="speak">▶ Kuula</button>
              <button data-act="del">🗑 Kustuta</button>
            </div>
          </div>`;
        card.querySelector('textarea').addEventListener('change', async ev => {
          e.note = ev.target.value; try { await DB.put(e); } catch (err) {}
        });
        card.querySelector('[data-act="speak"]').onclick = () => {
          speechSynthesis.cancel();
          (e.text.match(/[^.!?…]+[.!?…]*\s*/g) || [e.text]).forEach(s => speakSentence(s));
        };
        const delBtn = card.querySelector('[data-act="del"]');
        delBtn.onclick = async () => {
          if (!delBtn.classList.contains('confirm')) {
            delBtn.classList.add('confirm'); delBtn.textContent = 'Kinnita kustutamine';
            setTimeout(() => { delBtn.classList.remove('confirm'); delBtn.textContent = '🗑 Kustuta'; }, 3000);
            return;
          }
          await DB.del(e.id); renderJournal();
        };
        list.append(card);
      }
    }

    async function clearAll(btn) {
      if (!btn.classList.contains('confirm')) {
        btn.classList.add('confirm'); btn.textContent = 'Vajuta uuesti – kustutab KÕIK';
        setTimeout(() => { btn.classList.remove('confirm'); btn.textContent = '🗑 Kustuta kõik'; }, 3000);
        return;
      }
      await DB.clear(); btn.classList.remove('confirm'); btn.textContent = '🗑 Kustuta kõik';
      renderJournal();
    }

    // ---------- Allalaadimine ----------
    function download(filename, content, type) {
      const blob = new Blob([content], { type });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }
    const today = () => new Date().toISOString().slice(0, 10);

    async function exportTxt() {
      const items = (await DB.all()).sort((a, b) => a.id - b.id);
      if (!items.length) return;
      const txt = items.map((e, i) =>
        `#${i + 1} — ${fmtTime(e.time)}\n` +
        (e.lat != null ? `Asukoht: ${e.lat.toFixed(5)}, ${e.lon.toFixed(5)} (${mapUrl(e)})\n` : '') +
        `\n${e.text}\n` +
        (e.note ? `\nMinu märkus: ${e.note}\n` : '')
      ).join('\n----------------------------------------\n\n');
      download(`vietnami-paevik-${today()}.txt`, txt, 'text/plain;charset=utf-8');
    }

    async function exportHtml() {
      const items = (await DB.all()).sort((a, b) => a.id - b.id);
      if (!items.length) return;
      const cards = items.map((e, i) => `
        <article>
          <img src="${e.photo}" alt="">
          <div class="b">
            <p class="m">#${i + 1} · ${esc(fmtTime(e.time))}${e.lat != null ? ` · <a href="${mapUrl(e)}">📍 ${e.lat.toFixed(5)}, ${e.lon.toFixed(5)}</a>` : ''}</p>
            <p>${esc(e.text)}</p>
            ${e.note ? `<p class="n"><b>Minu märkus:</b> ${esc(e.note)}</p>` : ''}
          </div>
        </article>`).join('');
      const html = `<!DOCTYPE html><html lang="et"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vietnami reisipäevik ${today()}</title>
<style>
  body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f4f2;color:#1a1a1a;margin:0;padding:24px 16px;line-height:1.55}
  h1{max-width:760px;margin:0 auto 20px}
  article{max-width:760px;margin:0 auto 24px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  img{display:block;width:100%}
  .b{padding:14px 18px}
  .m{color:#666;font-size:14px;margin:0 0 8px}
  .n{background:#fff6d6;padding:8px 10px;border-radius:8px}
  a{color:#0f6b55}
</style></head><body>
<h1>Vietnami reisipäevik (${items.length} leidu)</h1>
${cards}
</body></html>`;
      download(`vietnami-paevik-${today()}.html`, html, 'text/html;charset=utf-8');
    }
  </script>
</body>
</html>
